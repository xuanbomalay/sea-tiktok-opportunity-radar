name: Daily sampled market research
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Load private persistent state
        uses: actions/checkout@v4
        with:
          path: state
          ref: main
      - name: Load public research code
        uses: actions/checkout@v4
        with:
          repository: xuanbomalay/sea-tiktok-opportunity-radar
          ref: main
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.lock
      - name: Install locked dependencies
        working-directory: code
        run: |
          pip install -r requirements.lock
          pip install --no-deps .
      - name: Configure private checkpoints
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect, evaluate and render
        id: collect
        continue-on-error: true
        working-directory: code
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_ONLY: 'true'
          RADAR_GIT_CHECKPOINT: 'true'
        run: python -m radar run --state-dir "$GITHUB_WORKSPACE/state/private" --output "$GITHUB_WORKSPACE/site"
      - name: Persist final state even when collection fails
        id: persist
        if: always()
        working-directory: state
        run: |
          git add private
          if ! git diff --cached --quiet; then
            git commit -m 'Save daily observation and evaluation state'
            git push origin HEAD:main
          fi
      - name: Add explicitly labeled synthetic demonstration
        if: always() && hashFiles('site/data/latest.json') != ''
        working-directory: code
        run: |
          python scripts/make_demo.py
          python -m radar replay artifacts/synthetic.json --synthetic --state-dir artifacts/demo-state --output "$GITHUB_WORKSPACE/site/demo" --no-agent
      - name: Publish validated public outputs
        if: always() && steps.persist.outcome == 'success' && hashFiles('site/data/latest.json') != ''
        working-directory: code
        env:
          RADAR_PUBLISH_TOKEN: ${{ secrets.RADAR_PUBLISH_TOKEN }}
        run: python scripts/publish_snapshot.py "$GITHUB_WORKSPACE/site"
      - name: Report unsuccessful live collection
        if: always() && steps.collect.outcome != 'success'
        run: |
          echo 'Live collection was not successful. Check credentials, the private status and the public health panel.'
          exit 1
