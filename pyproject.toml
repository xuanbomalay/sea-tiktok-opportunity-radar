[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-tiktok-opportunity-radar"
version = "0.1.0"
description = "An evidence-first, sampled TikTok Shop research pipeline for Southeast Asia"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "duckdb>=1.2,<2", "pyarrow>=18,<25",
  "scikit-learn>=1.6,<2", "plotly>=6,<7", "kaleido>=1,<2",
  "langgraph>=1,<2", "google-genai>=1,<3", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
